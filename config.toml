# Configuration guide: https://github.com/nvbangg/builder-for-morphe/blob/main/CONTRIBUTING.md

strict-sigcheck = false

[InShot]
enabled = true
brand = "morphe"
apkmirror-dlurl = "https://apkmirror.com"
changelog-keywords = ["InShot"]

[InShot.patches]
"github:arandomhooman/hoomans-morphe-patches" = ""   # FIXED: Changed from [] to "" to enable all patches

[vpnify]
enabled = true
brand = "morphe"
apkmirror-dlurl = "https://apkmirror.com"
changelog-keywords = ["vpnify"]

[vpnify.patches]
"github:rushiranpise/morphe-patches" = ""            # FIXED: Enables all vpnify premium patches

[MEGA]
enabled = true
brand = "morphe"
apkmirror-dlurl = "https://apkmirror.com"
changelog-keywords = ["MEGA"]

[MEGA.patches]
"github:rushiranpise/morphe-patches" = ""            # FIXED: Enables all MEGA cloud bypass patches

[Life360]
enabled = true
brand = "morphe"
apkmirror-dlurl = "https://apkmirror.com"
changelog-keywords = ["Life360"]

[Life360.patches]
"github:rushiranpise/morphe-patches" = ""            # FIXED: Enables all Life360 custom mapping patches
